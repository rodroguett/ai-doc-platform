openapi: 3.1.0

info:
  title: Plataforma de consulta documental
  version: 1.0.0
  description: |
    API de consulta sobre documentos regulatorios: responde en lenguaje
    natural y cita el documento y la sección de donde sale cada
    afirmación. Toda respuesta trae, además, una traza de cómo se produjo.

    El corpus de la demo es la Resolución de Calificación Ambiental del
    proyecto "Continuidad Operacional Minera Tres Valles", un documento
    público del Servicio de Evaluación Ambiental.

    **Aviso sobre tus preguntas.** Cada pregunta nueva se envía a Gemini,
    de Google, en su capa gratuita. Sus condiciones permiten a Google usar
    lo que recibe para mejorar sus productos, y que personas lo revisen.
    No escribas en una pregunta datos personales ni información que no
    deba salir de tu organización.

    Las respuestas las redacta un modelo y pueden ser incompletas o
    erróneas. Verifica cada afirmación en la cita que la acompaña.
  license:
    name: MIT

servers:
  # Relativa al origen que sirve este documento: la misma especificación
  # funciona en local y desplegada, y la documentación interactiva ejecuta
  # las peticiones contra el servicio que la publica.
  - url: /v1

tags:
  - name: queries
    description: Consultas semánticas
  - name: documents
    description: Ingesta y gestión del corpus
  - name: jobs
    description: Estado de trabajos asíncronos
  - name: usage
    description: Consumo y costos

paths:
  /queries:
    post:
      tags: [queries]
      summary: Ejecuta una consulta semántica
      description: |
        Recupera los pasajes del corpus que sustentan una respuesta y la
        redacta a partir de ellos. Cada afirmación de `answer` termina con
        la marca de su cita, `[1]`, `[2]`, que es la posición de esa cita en
        `citations`. Solo se devuelven como citas los pasajes que la
        respuesta cita.

        Un pasaje que no alcanza un puntaje mínimo de relación con la
        pregunta no se usa; si ninguno lo alcanza, la respuesta lo dice y no
        trae citas.

        Cuando ningún modelo redactó la respuesta, o lo que redactó no cita
        pasajes reales, `answer` lo indica y la traza lleva
        `degraded: true`: se entregan los pasajes más relacionados para que
        los lea quien consulta.
      operationId: createQuery
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Respuesta generada
          headers:
            X-Trace-Id:
              schema: { type: string }
              description: Identificador de traza distribuida
            X-RateLimit-Remaining:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /documents:
    get:
      tags: [documents]
      summary: Lista documentos del corpus
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: collection
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Página de documentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '429': { $ref: '#/components/responses/TooManyRequests' }

    post:
      tags: [documents]
      summary: Registra un documento para ingesta
      description: |
        Recibe un PDF con capa de texto, extrae y fragmenta su contenido, y
        encola la generación de embeddings. La respuesta llega cuando los
        fragmentos ya están guardados, lo que puede tomar varios segundos;
        use el job devuelto para seguir el resto del avance.

        Un archivo que no es un PDF legible, o un PDF escaneado sin capa de
        texto, se rechaza con 400.
      operationId: createDocument
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, collection]
              properties:
                file:
                  type: string
                  format: binary
                collection:
                  type: string
                  examples: ['rca']
                metadata:
                  type: string
                  description: JSON con metadatos libres del documento
      responses:
        '202':
          description: Documento aceptado para procesamiento
          headers:
            Location:
              schema: { type: string, format: uri }
              description: URL del job de ingesta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: Archivo excede el tamaño máximo
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Hay otra subida en curso; el servicio procesa una a la vez
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /documents/{documentId}:
    parameters:
      - name: documentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [documents]
      summary: Obtiene un documento
      operationId: getDocument
      responses:
        '200':
          description: Documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [documents]
      summary: Elimina un documento y sus chunks
      operationId: deleteDocument
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Eliminado
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [jobs]
      summary: Consulta el estado de un trabajo asíncrono
      operationId: getJob
      responses:
        '200':
          description: Estado del trabajo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /jobs/{jobId}/run:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [jobs]
      summary: Ejecuta una pasada de un trabajo
      description: |
        Procesa el trabajo durante un tiempo acotado y devuelve su estado. Si
        queda trabajo pendiente, la siguiente pasada se encola sola.

        El sistema la invoca por sí mismo después de registrar un documento;
        no hace falta llamarla. Queda disponible para relanzar un trabajo que
        se detuvo. Invocarla sobre un trabajo terminado, o que ya se está
        ejecutando, devuelve su estado sin efecto.
      operationId: runJob
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado del trabajo tras la pasada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: |
            El proveedor de embeddings no responde. El trabajo sigue en curso
            y la pasada puede reintentarse.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /usage:
    get:
      tags: [usage]
      summary: Consumo agregado del periodo
      description: >-
        Suma las consultas atendidas entre `from` y `to`, ambos incluidos, en
        días UTC. Sin `to`, hasta hoy; sin `from`, los 30 días que terminan en
        `to`. El periodo no puede superar 366 días. El costo es estimado a
        tarifa de lista (ADR-0013): el servicio corre en capas gratuitas y no
        paga nada.
      operationId: getUsage
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Consumo del periodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token opaco de escritura, entregado fuera de banda. No es un JWT ni
        identifica a un usuario: autoriza las operaciones que modifican el
        corpus.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Clave única del cliente. Reintentos con la misma clave devuelven
        la respuesta original en lugar de ejecutar la operación de nuevo.
      schema: { type: string, maxLength: 128 }

    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devuelto en la página anterior
      schema: { type: string }

    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:

    QueryRequest:
      type: object
      required: [question]
      examples:
        - question: ¿Con qué frecuencia se monitorea el agua subterránea?
          top_k: 3
          trace: full
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 2000
        collection:
          type: string
          description: Restringe la búsqueda a una colección
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        filters:
          type: object
          additionalProperties: true
          description: Filtros sobre los metadatos del documento
        trace:
          type: string
          enum: [summary, full]
          default: summary

    QueryResponse:
      type: object
      required: [query_id, answer, citations, trace]
      properties:
        query_id:
          type: string
          format: uuid
        answer:
          type: string
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        trace:
          $ref: '#/components/schemas/Trace'

    Citation:
      type: object
      required: [chunk_id, document_id, source, score]
      properties:
        chunk_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        source:
          type: string
          description: Nombre legible del documento
          examples: ['RCA 042/2019']
        locator:
          type: string
          description: Ubicación dentro del documento
          examples: ['considerando 7.3']
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        excerpt:
          type: string
          description: Fragmento recuperado que sustenta la respuesta

    Trace:
      type: object
      required: [trace_id, provider, model, cache, latency_ms]
      properties:
        trace_id:
          type: string
          description: Identificador OpenTelemetry
        provider:
          type: string
          description: Proveedor que redactó la respuesta, o `none` si ninguno
          examples: ['gemini']
        model:
          type: string
        cache:
          type: string
          enum: [hit, miss, bypass]
        degraded:
          type: boolean
          description: Verdadero si se respondió por fallback
          default: false
        unverified_figures:
          type: array
          items: { type: string }
          description: >-
            Cifras de la respuesta que no aparecen en los pasajes que cita su
            oración (ADR-0014). La respuesta se entrega igual, con un aviso al
            final del texto. Falta si todas las cifras están en lo citado.
        tokens:
          type: object
          properties:
            prompt: { type: integer }
            completion: { type: integer }
        estimated_cost_usd:
          type: number
          format: double
          description: >-
            Lo que habría costado la consulta con la tarifa de lista del
            proveedor en su capa de pago (ADR-0013). No es lo que se paga: el
            servicio corre en capas gratuitas. Falta si el modelo que
            respondió no tiene tarifa conocida; un costo desconocido no se
            informa como cero.
          examples: [0.00124]
        latency_ms:
          type: object
          properties:
            total: { type: integer }
            retrieval: { type: integer }
            generation: { type: integer }
        retrieved:
          type: array
          description: Solo presente con trace=full
          items:
            type: object
            properties:
              chunk_id: { type: string, format: uuid }
              score: { type: number, format: float }
              rank: { type: integer }

    Document:
      type: object
      required: [id, source, collection, status, created_at]
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        collection: { type: string }
        status:
          type: string
          enum: [pending, processing, ready, failed]
        chunk_count: { type: integer }
        metadata:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    DocumentPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        next_cursor:
          type: [string, 'null']
          description: Nulo cuando no hay más páginas

    Job:
      type: object
      required: [id, type, status, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [ingest]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        resource_id:
          type: string
          format: uuid
          description: |
            Documento sobre el que opera el trabajo. Existe desde que el
            trabajo se crea, en estado `pending` hasta que la ingesta termina.
        error:
          type: [string, 'null']
        created_at: { type: string, format: date-time }

    Usage:
      type: object
      required: [period_start, period_end, queries, cache_hit_rate, tokens_total, estimated_cost_usd, queries_without_cost_estimate, by_provider]
      properties:
        period_start: { type: string, format: date }
        period_end:
          type: string
          format: date
          description: Último día incluido
        queries:
          type: integer
          description: Consultas atendidas, incluidas las respondidas desde la caché
        cache_hit_rate:
          type: number
          format: double
          description: Fracción de las consultas respondidas desde la caché; 0 si no hubo consultas
        tokens_total:
          type: integer
          format: int64
          description: Tokens de entrada y salida de la generación
        estimated_cost_usd:
          type: number
          format: double
          description: >-
            Lo que habrían costado las consultas a tarifa de lista; no es lo
            que se paga. No incluye las consultas sin costo conocido.
        queries_without_cost_estimate:
          type: integer
          description: Consultas de un modelo sin tarifa conocida, que no suman al costo
        by_provider:
          type: array
          description: Proveedor que respondió cada consulta, o `none` si ninguno
          items:
            type: object
            required: [provider, queries, estimated_cost_usd]
            properties:
              provider: { type: string }
              queries: { type: integer }
              estimated_cost_usd: { type: number, format: double }

    Problem:
      type: object
      description: Error conforme a RFC 9457
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ['https://api.example.cl/problems/validation-error']
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        trace_id: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Credenciales ausentes o inválidas
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: Esquema de autenticación esperado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Límite de solicitudes excedido
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Sin proveedor de generación disponible
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

# Sin requisito por omisión: leer y consultar es público. Las operaciones que
# escriben declaran su propio requisito.
security: []
