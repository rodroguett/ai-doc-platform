name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Una dependencia que exija un Go más nuevo debe fallar, no descargarlo.
  GOTOOLCHAIN: local

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Misma imagen que `make db-up`. Los tests de persistencia corren
      # contra un Postgres real con pgvector.
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aidoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aidoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aidoc?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Verify generated code is up to date
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          oapi-codegen -config api/codegen.yaml api/openapi.yaml
          git diff --exit-code internal/gateway/api/openapi_gen.go \
            || (echo "El código generado no está sincronizado con el spec. Ejecute 'make generate'." && exit 1)

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
