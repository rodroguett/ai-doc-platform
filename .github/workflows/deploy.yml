name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  SERVICE: gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for artifact registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/containers/${{ env.SERVICE }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/containers/${{ env.SERVICE }}:${{ github.sha }}
          # Los secretos viven en Secret Manager. Aquí solo figuran sus
          # nombres, nunca sus valores.
          secrets: |-
            DATABASE_URL=database-url:latest
            API_WRITE_TOKEN=api-write-token:latest
            GEMINI_API_KEY=gemini-api-key:latest
          # Una sola instancia: acota el costo en el peor caso y hace exacto
          # el límite de peticiones, que vive en memoria.
          # 512 MiB: el motor de extracción de PDF reserva unos 310 y una
          # subida retiene hasta 20 más (ADR-0009). 120 s: extraer un
          # documento largo dentro de la petición de subida toma decenas de
          # segundos.
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=1
            --memory=512Mi
            --cpu=1
            --port=8080
            --timeout=120s

      # /health prueba que la revisión nueva arrancó; /ready, que además
      # alcanza sus dependencias. Un fallo aquí marca el despliegue en rojo
      # pero no lo revierte: la revisión ya está recibiendo tráfico.
      - name: Smoke test
        run: |
          for path in health ready; do
            ok=""
            for i in {1..5}; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/$path")
              [ "$code" = "200" ] && echo "/$path ok" && ok=1 && break
              echo "/$path attempt $i returned $code, retrying"
              sleep 5
            done
            [ -n "$ok" ] || exit 1
          done
